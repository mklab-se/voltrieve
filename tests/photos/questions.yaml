# Photo questions with known answers, for `uv run tests/routing/check.py --photos`.
#
# Every photo is drawn by code or comes from the repository's own pictures (see signs.py and
# pictures.py): `sign` is one of the eight parking signs, `lamp` a Spark with a cracked headlamp on
# its left or right, `car` the undamaged Spark, `blurred` a sign photographed at speed.
#
# `context.when` is the car's clock, local time. `rule` says how the verdict was made: a stay of
# `minutes` (with `charging`), or the `fee`. test_questions.py checks every verdict against the rules
# of signs.py, so a wrong answer here cannot hide.
#
# `verdict` is yes or no at the start of the answer. `article` and `no_article` are resolved from
# data/generated/parts-index.json by key and vehicle: `no_article: any` forbids every article number.
# `rejected` means the upload must be refused with that code, so there is no chat turn.
# `free_sources` leaves the knowledge bases out of the judgement.
#
# The first questions are a spread of all kinds: --limit 20 takes the first turns.
questions:
  - { id: sign-fee-tue-3h, group: sign, photo: { sign: two_hours_fee }, context: { when: "2026-11-24 10:00" }, ask: "Can I park here for 3 hours?", expect: [], verdict: "no", rule: { minutes: 180 } }
  - { id: lamp-left-site, group: lamp, photo: { lamp: left }, ask: "This is my Voltrieve Spark. What is broken, and which part do I need?", expect: [parts], article: { key: headlamp_left, fits: Voltrieve Spark }, no_article: { key: headlamp_right, fits: Voltrieve Spark }, mentions: [left] }
  - { id: undamaged-site, group: undamaged, photo: { car: undamaged }, ask: "This is my Voltrieve Spark. What is broken, and which part do I need?", expect: [], free_sources: true, no_article: any }
  - { id: sign-charging-yes, group: sign, photo: { sign: charging }, context: { when: "2026-11-24 10:00" }, ask: "I will charge the whole time. Can I park here for 1 hour?", expect: [], verdict: "yes", rule: { minutes: 60, charging: true } }
  - { id: blurred-sign, group: blurred, photo: { blurred: two_hours_fee }, ask: "Can I park here?", expect: [], rejected: too_blurry }
  - { id: sign-as-part, group: broken-part, photo: { sign: two_hours_fee }, ask: "This looks broken on my Voltrieve Spark. Which part do I need to order?", expect: [], free_sources: true, no_article: any }
  - { id: which-part-left, group: which-part, photo: { lamp: left }, ask: "Which part is this?", expect: [], free_sources: true, no_article: { key: headlamp_right, fits: Voltrieve Spark } }
  - { id: car-parking, group: car-parking, photo: { car: undamaged }, context: { when: "2026-11-24 10:00" }, ask: "Can I park here for 3 hours?", expect: [], mentions: [sign], no_article: any }
  - { id: lamp-right-site, group: lamp, photo: { lamp: right }, ask: "This is my Voltrieve Spark. What is broken, and which part do I need?", expect: [parts], article: { key: headlamp_right, fits: Voltrieve Spark }, no_article: { key: headlamp_left, fits: Voltrieve Spark }, mentions: [right] }
  - { id: lamp-left-car, group: lamp, photo: { lamp: left }, context: { when: "2026-11-24 10:00" }, ask: "What is broken on the car in this photo? Which part do I need?", expect: [parts], article: { key: headlamp_left, fits: Voltrieve Spark }, no_article: { key: headlamp_right, fits: Voltrieve Spark }, mentions: [left] }
  - { id: lamp-right-car, group: lamp, photo: { lamp: right }, context: { when: "2026-11-24 10:00" }, ask: "What is broken on the car in this photo? Which part do I need?", expect: [parts], article: { key: headlamp_right, fits: Voltrieve Spark }, no_article: { key: headlamp_left, fits: Voltrieve Spark }, mentions: [right] }
  - { id: undamaged-car, group: undamaged, photo: { car: undamaged }, context: { when: "2026-11-24 10:00" }, ask: "What is broken on the car in this photo? Which part do I need?", expect: [], free_sources: true, no_article: any }
  - { id: which-part-right, group: which-part, photo: { lamp: right }, ask: "Which part is this?", expect: [], free_sources: true, no_article: { key: headlamp_left, fits: Voltrieve Spark } }
  - { id: sign-as-part-charging, group: broken-part, photo: { sign: charging }, ask: "The part in this photo is broken on my Voltrieve Spark. What is its article number?", expect: [], free_sources: true, no_article: any }

