[project]
name = "voltrieve-doors"
version = "0.1.0"
description = "MCP doors for Voltrieve: the guard, the token check and the tools' rules, shared by the API and the dealer service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyJWT[crypto]",
    "httpx",
    "mcp==2.3.0",
    "opentelemetry-api",
    "starlette",
]

[dependency-groups]
dev = [
    "httpx2",
    "opentelemetry-sdk",
    "pytest",
    "pytest-asyncio",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voltrieve_doors"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
