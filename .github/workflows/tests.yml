name: Tests

# The offline suites: no Azure sign-in, no secrets. Live checks (smoke, routing) run by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - agent_core
          - api
          - agents/hosted
          - clients/cli
          - data/generator
          - doors
          - infra/scripts/entra
          - search
          - services/dealer
          - services/insights
          - tests/contract
          - tests/photos
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock
      # The document generator renders its PDFs in a headless Chromium.
      - if: matrix.project == 'data/generator'
        run: uv run --locked playwright install --with-deps --only-shell chromium
      - run: uv run --locked pytest -q

  web:
    name: clients/web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  dashboard:
    name: clients/dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  car:
    name: clients/car
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/car
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/car/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  dealer-site:
    name: services/dealer/site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dealer/site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/dealer/site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  infra:
    name: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx pytest -q infra/tests
      - run: sh infra/tests/test_bicep.sh
      - run: sh infra/tests/test_web_env.sh
