  topic: charging
  car_model: ragn
  kind: how_to
  result: answered
  said:
  - Which cable do I need for the public charging posts in town?
  - A Mode 3 cable with type 2 connectors at both ends. The Voltrieve one is 5 metres and rated for 32 A.
  - Is it the same cable at fast chargers?
  - No, at a fast charger the cable is fixed to the charger, so you need none of your own.
