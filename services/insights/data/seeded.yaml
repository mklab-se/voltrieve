- id: a017
  lang: sv
  client: car
  stated: spark
  topic: range_battery
  car_model: spark
  kind: how_to
  result: answered
  said:
  - Hur långt kommer jag på en laddning?
  - Spark går upp till 310 kilometer på en full laddning. I kyla och på motorväg blir det kortare.
  - Hur mycket kortare på vintern?
  - Räkna med en fjärdedel till en tredjedel mindre när det är riktigt kallt.
  - Och på sommaren i stan?
  - Då kommer du nära de 310 kilometerna, ibland lite mer.
  - Vad händer när den visar noll?
  - Den har en liten reserv, men räkna inte med den. Ladda i god tid.
  - Kan jag se hur mycket jag drar?
  - Ja, i energimenyn ser du förbrukningen för de senaste 50 kilometerna.
  - Vad är bra förbrukning?
  - För Spark är runt 14 kWh per 100 kilometer bra på sommaren.
  - Jag ligger på 19 nu.
  - Det är normalt i kyla och korta resor.
  - Blir räckvidden ungefär 220 då?
  - Ja, ungefär så med den förbrukningen.
