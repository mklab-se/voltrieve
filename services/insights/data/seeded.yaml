- id: a006
  lang: en
  client: web
  stated: atlas
  topic: charging
  car_model: atlas
  kind: how_to
  result: answered
  said:
  - What's the fastest the Atlas can charge?
  - It peaks at 320 kW at a low state of charge. At half full it still takes 260 kW, and at 80 percent about 120
    kW.
  - So it's not worth waiting after 80?
  - Usually not. On a long trip it is quicker to leave at 80 percent and stop once more.
