- id: a004
  lang: en
  client: car
  stated: fjord
  topic: charging
  car_model: fjord
  kind: how_to
  result: answered
  said:
  - how slow is charging from an ordinary household plug
  - A household socket gives a little over 2 kW, so a Fjord with its 84 kWh battery needs roughly 40 hours from
    empty to full. Most people only top up overnight.
  - and with the wall box?
  - The Fjord has a 22 kW onboard charger. With the Voltrieve Home Charger on three phases it takes about four and
    a half hours.
