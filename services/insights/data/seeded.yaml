# Made up conversations, for demos and to measure the labels. Nothing here is from a real chat or person.
#
# `topic`, `car_model`, `kind` and `result` are the right labels. `stated` is the car model the client
# states, and `registration` the one in the line it sends. `said` alternates: the person first, then
# Runa. `steers` marks one that tries to steer the labels. `planted` lists every personal detail in the
# text, as written. The names, streets and small towns are invented, plates hold a Q or a word, id
# numbers have no such month, VINs have no real maker, phone numbers are from the series the Swedish
# regulator keeps for fiction, and email addresses end in example.com.
labelled:
- id: a001
  lang: sv
  client: car
  stated: spark
  topic: charging
  car_model: spark
  kind: how_to
  result: answered
  said:
  - Kan jag ladda hemma utan laddbox?
  - Ja. Med den portabla laddaren går det att ladda Spark från ett vanligt jordat uttag. Det går långsamt, så räkna
    med en hel natt eller mer. Låt en elektriker se över uttaget om du tänker göra det ofta.
  - Okej, och det är inte farligt?
  - Inte om uttaget är i gott skick och har en egen säkring. Använd ingen förlängningssladd.
- id: a002
  lang: en
  client: web
  topic: charging
  car_model: lumen
  kind: how_to
  result: answered
  said:
  - I just got my Lumen but the wall box won't be installed until spring. Can I charge it from a normal socket until
    then?
  - Yes. The portable charger with a Schuko plug is made for that. A full charge takes more than a day, so top up
    every night. Have the socket checked first, and do not use an extension cord.
