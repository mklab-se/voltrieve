[project]
name = "voltrieve-insights"
version = "0.1.0"
description = "Voltrieve usage insights: reads stored chats and saves only totals of five people or more"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "azure-identity==1.27.0",
    "voltrieve-agent-core",
]

[tool.uv.sources]
voltrieve-agent-core = { path = "../../agent_core" }

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "respx==0.23.1",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voltrieve_insights"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
# Nothing released less than 168 hours before 2026-11-24 (a date CI can use as it is).
exclude-newer = "2026-11-17T00:00:00Z"
