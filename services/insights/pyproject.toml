[project]
name = "voltrieve-insights"
version = "0.1.0"
description = "Voltrieve usage insights: reads stored chats and saves only totals of five people or more"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "azure-identity==1.27.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "respx==0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voltrieve_insights"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
